[project]
name = "files"
version = "0.1.0"
description = "Simple file server with OIDC auth"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  "Authlib==1.8.0",
  "cachetools==7.2.0",
  "fastapi==0.141.1",
  "httpx2==2.13.0",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "pydantic==2.13.5",
  "pydantic_settings==2.15.0",
  "python-multipart==0.0.32",
  "requests==2.34.2",
  "uvicorn==0.53.0",
]

[tool.uv]
package = true

[project.scripts]
files = "files:main"
