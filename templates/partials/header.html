<nav class="account-nav">
    <span>Welcome
    {% if user.details != None %}
        {{ user.details.display_name }}!
    {% elif user.backend == AuthBackend.RECOVERY %}
        Recovery Admin!
    {% else %}
        guest!
    {% endif %}
    </span>
    <ul>
        <li>
            {% if user.backend == AuthBackend.OIDC %}
            <a class="button" href="{{ api_path }}/auth/logout?next={{ path | urlencode }}">Log out</a>
            {% else %}
            <a class="button" href="{{ api_path }}/auth/login?next={{ path | urlencode }}">Login</a>
            {% endif %}
        </li>
    </ul>
</nav>
<hr>
